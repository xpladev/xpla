name: Go

on:
  push:
    branches: [ "main", "cube", "tesseract", "release/*" ]
  pull_request:
    branches: [ "*" ]

jobs:

  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        go-version: [1.23.x]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go-version }}

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: tests/solidity/pnpm-lock.yaml

    - name: Protogen test
      run: make proto-gen

    - name: Test
      run: |
        go mod tidy
        make test
