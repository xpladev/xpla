name: Build and publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to build and publish (e.g. v1.12.1)
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Check out build definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: recipe

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', env.TAG) || github.sha }}
          path: source

      - name: Prepare build context
        id: meta
        working-directory: source
        run: |
          # Build historical sources with the current image definition.
          cp ../recipe/Dockerfile ../recipe/.dockerignore .
          echo "image=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: source
          file: source/Dockerfile
          target: publish
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image }}:${{ env.TAG }}-${{ matrix.arch }}
          build-args: |
            GIT_VERSION=${{ env.TAG }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha,scope=xpla-publish-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=xpla-publish-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
